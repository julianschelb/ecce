name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # reused by "Deploy to dev" to test the ref it deploys
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to test (defaults to the triggering commit)
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts && ruff format --check app tests scripts
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Full-stack image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ecce:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name ecce -e ADMIN_PASSWORD=ci -e PORT=8000 -p 8000:8000 ecce:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 2; done
          # the image imports its seeds on a background thread: wait for the first corpus
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/corpora | grep -q alice-in-wonderland && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/corpora | grep -q alice-in-wonderland || { docker logs ecce; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:8000/corpus/alice-in-wonderland || { docker logs ecce; exit 1; }
          curl -sf http://127.0.0.1:8000/api/corpora/alice-in-wonderland/pages/1 | grep -q '"opens_document":true' || { docker logs ecce; exit 1; }
          docker rm -f ecce
