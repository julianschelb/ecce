name: Deploy (manual fallback)

# Production deploys happen through Railway's GitHub integration: every push to `main`
# builds the root Dockerfile on Railway (after the CI check suite passes). This workflow is
# only a manual fallback, e.g. to redeploy without a new commit. It needs the repository
# secret RAILWAY_TOKEN (a Railway *project* token for the production environment).
on:
  workflow_dispatch:

jobs:
  railway:
    name: Railway
    runs-on: ubuntu-latest
    concurrency: railway-production
    steps:
      - uses: actions/checkout@v7
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ecce --ci
