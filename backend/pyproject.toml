[project]
name = "ecce-backend"
version = "2.0.0"
description = "ECCE backend: explore text corpora as implicit entity networks (FastAPI + SQLite)."
authors = [{ name = "Julian Schelb", email = "julian.schelb@uni-konstanz.de" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.22,<0.1",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyjwt>=2.8,<3.0",
    "python-multipart>=0.0.9",
    "implicit-word-network>=0.1.0,<0.2",
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
]

[project.optional-dependencies]
spacy = [
    "spacy>=3.7,<4.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
gliner = ["implicit-word-network[gliner]>=0.1.0,<0.2"]
# GLiNER2 / GLiNER 2.5: entities and relation types (experimental, offline seed builds)
gliner2 = ["gliner2[local]>=2.0,<3", "transformers<5", "sentencepiece", "protobuf"]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B905", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.mypy]
python_version = "3.12"  # numpy stubs use PEP 695 syntax
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]
